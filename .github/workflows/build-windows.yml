name: Build Windows app

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller search.spec --noconfirm

      - name: Zip the build
        run: Compress-Archive -Path dist/EmbeddingGemma2LocalSearch -DestinationPath EmbeddingGemma2LocalSearch-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmbeddingGemma2LocalSearch-windows
          path: app/EmbeddingGemma2LocalSearch-windows.zip
